<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Poliscope · 七人议会争议证据地图</title>
    <!-- 站点图标（研究者的自定义 icon.png）：favicon.ico 兼顾旧浏览器，
         PNG 尺寸覆盖高 DPI 与固定标签页；192/512 供 PWA 图标位。 -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <meta
      name="description"
      content="Poliscope 组织 7 名 AI 科学家审查有争议的计算社会科学问题：独立取证、交叉质询、专门找反例，产出一张结论与局限并排、证据可溯源、异议不删除的证据地图。"
    />
    <!-- PP Neue Montreal（正文）：加载自模板同款的 Webflow CDN；加载失败
         时字体栈自动退回系统字体（tokens.css 的 --font），不影响布局。
         PP Mondwest（serif 强调）是商业字体，仓库不携带文件：把
         PPMondwest-Regular.woff2 放进 apps/web/public/ 即启用，缺失时
         serif 槽位回退 Georgia / 系统衬线。 -->
    <link rel="preconnect" href="https://assets.website-files.com" crossorigin />
    <style>
      @font-face {
        font-family: "PP Neue Montreal";
        src: url("https://assets.website-files.com/6009ec8cda7f305645c9d91b/60176f9bb43e36419997ecfe_PPNeueMontreal-Book.otf")
          format("opentype");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "PP Neue Montreal";
        src: url("https://assets.website-files.com/6009ec8cda7f305645c9d91b/60176f9b39c5673e51a86f5a_PPNeueMontreal-Medium.otf")
          format("opentype");
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: "PP Mondwest";
        src: url("/PPMondwest-Regular.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
    </style>
  </head>

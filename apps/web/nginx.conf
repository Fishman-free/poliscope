# Mirrors vite.config.ts's dev proxy: /api goes to the API container, the
# workspace's SSE stream (Server-Sent Events) works over a plain proxied
# connection, and everything else serves the static build.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving `api` through a variable + resolver
    # instead of a static proxy_pass makes nginx re-resolve the upstream on
    # every request: a rebuilt api container gets a new IP, and a static
    # proxy_pass (resolved once at startup) would keep hitting the dead
    # address until this container is restarted by hand.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Health check lives outside /api/; without this exact match it would fall
    # into the SPA fallback below and return index.html instead of the API's
    # {"status": "ok"} JSON.
    location = /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    # Uploads (task PDFs, knowledge-base documents) can reach 20 MB; the
    # default 1 MB limit would return 413 at this layer before the API ever
    # sees the request. Matches MAX_UPLOAD_BYTES in apps/api/routers/papers.py.
    client_max_body_size 20m;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Server-Sent Events must not be buffered or the workspace stream
        # arrives in bursts instead of live updates.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}

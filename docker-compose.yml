# Local Docker Compose stack for Poliscope.
#
# Redis is deliberately absent: the work queue is a `SELECT ... FOR UPDATE
# SKIP LOCKED` query against Postgres (see apps/worker/main.py's module
# docstring for why), and nothing in this MVP yet uses Redis for caching or
# SSE fan-out either -- adding a service nothing depends on would violate
# CLAUDE.md 14's YAGNI mandate. Add it back the day something actually reads
# from it.
#
# Usage:
#   cp .env.example .env    # then edit .env -- see its comments
#   docker compose up --build
#
# `migrate` is a one-shot init container: it runs `alembic upgrade head`
# (which also creates the poliscope_app / poliscope_projector database roles,
# see migrations/versions/0001_research_and_calls.py) and exits. `api` and
# `worker` wait for it to exit 0 before starting, via
# `service_completed_successfully`.
services:
  postgres:
    # Pulled from AWS ECR Public instead of Docker Hub: Hub is intermittently
    # unreachable from mainland-China hosts, and this deployment targets such a
    # host. The image is the same official postgres:16-alpine, just mirrored.
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POLISCOPE_DB_SUPERUSER:-poliscope_admin}
      POSTGRES_PASSWORD: ${POLISCOPE_DB_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: ${POLISCOPE_DB_NAME:-poliscope}
    volumes:
      - poliscope-postgres-data:/var/lib/postgresql/data
    # Host mapping binds loopback only: `api` and `worker` reach Postgres over
    # the compose-internal network (`postgres:5432`), so the host port exists
    # solely for the developer's psql/backup access and must never be
    # reachable from the public internet on a cloud host.
    ports:
      - "127.0.0.1:${POLISCOPE_DB_HOST_PORT:-55440}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      POLISCOPE_MIGRATOR_DATABASE_URL: "postgresql+asyncpg://${POLISCOPE_DB_SUPERUSER:-poliscope_admin}:${POLISCOPE_DB_SUPERUSER_PASSWORD:?set in .env}@postgres:5432/${POLISCOPE_DB_NAME:-poliscope}"
      POLISCOPE_APP_DATABASE_PASSWORD: ${POLISCOPE_APP_DATABASE_PASSWORD:?set in .env}
      POLISCOPE_PROJECTOR_DATABASE_PASSWORD: ${POLISCOPE_PROJECTOR_DATABASE_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      POLISCOPE_APP_DATABASE_URL: "postgresql+asyncpg://poliscope_app:${POLISCOPE_APP_DATABASE_PASSWORD:?set in .env}@postgres:5432/${POLISCOPE_DB_NAME:-poliscope}"
      # Optional: a GitHub Personal Access Token lifts the skill-install API
      # quota from 60/hour to 5000/hour and unlocks private repositories.
      # Without it, installs still work -- raw/tarball downloads carry no
      # quota -- only the recursive tree scan is rate limited (and falls
      # back to the tarball transparently).
      POLISCOPE_GITHUB_TOKEN: "${POLISCOPE_GITHUB_TOKEN:-}"
      # Free-trial vendor key (round-7): the API's /settings/model/free-trial
      # endpoint probes and stores this endpoint on demand. Blank = the
      # trial is disabled for every account.
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # Email verification (round-8): registration sends a 6-digit code via
      # SMTP. Blank SMTP_HOST = the register endpoint refuses with 503 (the
      # API process owns sending -- the worker never emails).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    # No `ports:` here on purpose: `caddy` is the only service allowed to
    # bind a host port (see its comment below), so the shared password at
    # the edge cannot be routed around by hitting this container directly.
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      POLISCOPE_APP_DATABASE_URL: "postgresql+asyncpg://poliscope_app:${POLISCOPE_APP_DATABASE_PASSWORD:?set in .env}@postgres:5432/${POLISCOPE_DB_NAME:-poliscope}"
      POLISCOPE_PROJECTOR_DATABASE_URL: "postgresql+asyncpg://poliscope_projector:${POLISCOPE_PROJECTOR_DATABASE_PASSWORD:?set in .env}@postgres:5432/${POLISCOPE_DB_NAME:-poliscope}"
      # Left unset by default: gateway_from_env()/tool_gateway_from_env()
      # degrade to an honest COMPLETED_WITH_GAPS run rather than failing (see
      # apps/worker/main.py's WorkerContext docstring). Fill these in .env to
      # run against a real OpenAI-Chat-Completions-compatible vendor -- never
      # point them at this Claude Code session's own ANTHROPIC_* credentials.
      POLISCOPE_MODEL_API_KEY: ${POLISCOPE_MODEL_API_KEY:-}
      POLISCOPE_MODEL_BASE_URL: ${POLISCOPE_MODEL_BASE_URL:-}
      POLISCOPE_MODEL_NAME: ${POLISCOPE_MODEL_NAME:-}
      POLISCOPE_MODEL_NAME_STRONG_REASONING: ${POLISCOPE_MODEL_NAME_STRONG_REASONING:-}
      POLISCOPE_MODEL_NAME_MEDIUM: ${POLISCOPE_MODEL_NAME_MEDIUM:-}
      POLISCOPE_MODEL_NAME_LIGHTWEIGHT: ${POLISCOPE_MODEL_NAME_LIGHTWEIGHT:-}
      POLISCOPE_TOOLS_CONTACT_EMAIL: ${POLISCOPE_TOOLS_CONTACT_EMAIL:-}
      POLISCOPE_TOOLS_SEMANTIC_SCHOLAR_API_KEY: ${POLISCOPE_TOOLS_SEMANTIC_SCHOLAR_API_KEY:-}
      # Free-trial vendor key (round-7): enables the per-account qwen3.8-max
      # trial in Model Settings. The worker reads it through the stored task
      # config, so this env is for the API's activation probe; a deployment
      # that skips the trial simply leaves it blank.
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # Same reasoning as `api`: reachable only from `caddy` on the compose
    # network, not from the host directly.
    expose:
      - "80"
    depends_on:
      - api

  # The single public entrypoint. Everything else in this file is only
  # reachable on the compose-internal network -- this is the one service
  # that binds a host port. Caddy only proxies (no basic_auth since the
  # account system took over access control); see deploy/caddy/Caddyfile for
  # the routing (it forwards everything to `web`, whose own nginx already
  # splits /api/* from the static build).
  #
  # POLISCOPE_SITE_ADDRESS defaults to ":80" (plain HTTP, works on localhost
  # or a bare cloud IP with no domain). Once a real domain is pointed at this
  # host, set POLISCOPE_SITE_ADDRESS to that domain in .env and Caddy
  # automatically requests and renews a real HTTPS certificate for it -- no
  # other change anywhere in this stack.
  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    environment:
      POLISCOPE_SITE_ADDRESS: ${POLISCOPE_SITE_ADDRESS:-:80}
    # Note: the legacy POLISCOPE_SITE_USERNAME / POLISCOPE_SITE_PASSWORD
    # shared-password variables are gone -- caddy is pure transport and the
    # account system (register / login, per-account isolation) owns access
    # control. There is nothing left to configure here.
    # POLISCOPE_SITE_HOST_PORT(_TLS) default to the standard 80/443 for a real
    # deployment. Override only if this host already has something else bound
    # to 80/443 (e.g. a different project's reverse proxy) -- this changes
    # which host port Caddy answers on, not POLISCOPE_SITE_ADDRESS above.
    ports:
      - "${POLISCOPE_SITE_HOST_PORT:-80}:80"
      - "${POLISCOPE_SITE_HOST_PORT_TLS:-443}:443"
    volumes:
      - poliscope-caddy-data:/data
      - poliscope-caddy-config:/config
    depends_on:
      - web

volumes:
  poliscope-postgres-data:
  poliscope-caddy-data:
  poliscope-caddy-config:

name: Diag docker daemon

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect docker daemon
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            'echo "=== docker info RegistryMirrors ==="; docker info 2>/dev/null | grep -iA3 mirror || echo "no mirror config"; \
             echo "=== daemon.json ==="; cat /etc/docker/daemon.json 2>/dev/null || echo "no daemon.json"; \
             echo "=== local images ==="; docker images --format "{{.Repository}}:{{.Tag}}" | head -20; \
             echo "=== pull test ==="; docker pull docker.io/library/python:3.12-slim 2>&1 | tail -3'

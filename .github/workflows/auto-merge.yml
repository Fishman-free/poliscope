name: Auto Approve and Merge PR

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# 赋予以 Bot 身份审批和合并 PR 的权限
permissions:
  pull-requests: write
  contents: write

jobs:
  auto-approve-and-merge:
    runs-on: ubuntu-latest
    # 自动合并范围：
    # - 仓库 collaborator（有写权限的协作者）发起的 PR
    # - contributor（通过 fork 贡献过且 PR 已被合入过的人）发起的 PR
    # - dependabot 发起的 PR
    # - 显式打了 automerge 标签的 PR
    # 完全陌生的人（author_association 为 NONE / FIRST_TIMER 等）的 PR 不
    # 自动合并，需人工审批——这是避免任何外部提交被直接合进主干的安全兜底。
    if: >-
      github.event.pull_request.author_association == 'COLLABORATOR' ||
      github.event.pull_request.author_association == 'CONTRIBUTOR' ||
      github.actor == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'automerge')

    steps:
      # 1. 自动 Approve 该 PR
      - name: Auto Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 自动开启 Auto-Merge（等待 CI 测试通过后会自动合并）
      - name: Enable Auto-Merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

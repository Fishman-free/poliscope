name: Diag mirror reachability

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test mirrors
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            'for m in docker.m.daocloud.io docker.1ms.run docker.mirrors.ustc.edu.cn; do \
               echo "=== $m python:3.12-slim ==="; \
               timeout 40 docker pull $m/library/python:3.12-slim 2>&1 | tail -2; \
             done'
